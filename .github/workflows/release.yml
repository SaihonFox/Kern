name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-14
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package kernc + libs + examples
        shell: pwsh
        run: ./tools/package-release.ps1 -Rid ${{ matrix.rid }}
      - name: Smoke test
        if: runner.os != 'macOS'
        shell: pwsh
        run: |
          $exe = Join-Path "dist" "kern-${{ matrix.rid }}" "kernc"
          if ($IsWindows) { $exe += ".exe" }
          & $exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: kern-${{ matrix.rid }}
          path: dist/kern-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kern-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
