# Автоматический релиз Kern.
#
#  * push в master  -> prerelease v<версия>-build.<номер запуска> (версия из kern-version);
#  * push тега v*   -> обычный релиз с этим тегом (он же становится latest);
#  * workflow_dispatch -> то же, что push в master, но версию можно задать вручную.
#
# Перед упаковкой запускаются style/build/test, поэтому сломанный коммит
# релиз не публикует. Архивы: kern-<rid>.zip (kernc + libs/ + examples/)
# и SHA256SUMS.txt.
name: release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без префикса v (по умолчанию первая строка kern-version)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          base="$(grep -v '^[[:space:]]*#' kern-version | grep -v '^[[:space:]]*$' | head -n1 | tr -d '[:space:]' || true)"
          base="${base#v}"
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            name="Kern $REF_NAME"
            prerelease="false"
          else
            version="${INPUT_VERSION:-$base}"
            version="${version#v}"
            if [ -z "$version" ]; then
              echo "::error::не удалось определить версию (kern-version пуст?)"
              exit 1
            fi
            tag="v${version}-build.${RUN_NUMBER}"
            name="Kern ${version} build ${RUN_NUMBER} (${SHA:0:7})"
            prerelease="true"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Релиз: $tag ($name), prerelease=$prerelease"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Style
        run: node tools/check-style.mjs
      - name: Build
        run: dotnet build Kern.slnx -c Release --nologo
      - name: Test
        run: dotnet test Kern.slnx -c Release --no-build --nologo

  package:
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-14
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package kernc + libs + examples
        shell: pwsh
        run: ./tools/package-release.ps1 -Rid ${{ matrix.rid }}
      - name: Smoke test
        if: runner.os != 'macOS'
        shell: pwsh
        run: |
          $exe = Join-Path "dist" "kern-${{ matrix.rid }}" "kernc"
          if ($IsWindows) { $exe += ".exe" }
          & $exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: kern-${{ matrix.rid }}
          path: dist/kern-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kern-*
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.name }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'false' }}
          generate_release_notes: true
      # Загрузка по одному файлу с проверкой состояния: GitHub иногда оставляет
      # ассет в состоянии starter (скачивание 404), хотя softprops отчитывается
      # об успехе. Такой ассет удаляется и загружается заново.
      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.zip artifacts/SHA256SUMS.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::нет файлов для загрузки"
            exit 1
          fi
          asset_state() {
            gh api "repos/$GH_REPO/releases/tags/$TAG" \
              --jq ".assets[] | select(.name == \"$1\") | .state" 2>/dev/null || true
          }
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            uploaded=0
            for attempt in 1 2 3; do
              if ! gh release upload "$TAG" "$file" --clobber; then
                echo "загрузка $name не удалась (попытка $attempt)" >&2
                sleep 10
                continue
              fi
              for _ in $(seq 1 24); do
                state="$(asset_state "$name")"
                if [ "$state" = "uploaded" ]; then
                  uploaded=1
                  break
                fi
                sleep 5
              done
              [ "$uploaded" -eq 1 ] && break
              echo "ассет $name завис в состоянии '${state:-нет}', повтор" >&2
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "::error::ассет $name не загрузился"
              exit 1
            fi
            echo "загружено: $name"
          done
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.state)"'
