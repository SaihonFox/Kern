# ШАБЛОН CI (активировать на M12, когда проект выложен в GitHub). Файл лежит в .github/workflows/.
name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Style
        run: node tools/check-style.mjs
      - name: Build
        run: dotnet build Kern.slnx -c Release --nologo
      - name: Test
        run: dotnet test Kern.slnx -c Release --no-build --nologo
